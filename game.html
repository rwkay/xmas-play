<!doctype html>
<html lang="en-us">
  <head>
    <script>
      // (pages/game-head.html, put into the published game page by pages/deploy.js) The service worker decrypts the
      // game's files with the key the password page kept in localStorage. Phones stop service workers whenever they
      // like, and a restarted one has lost the key, so this page hands it over as it opens and again whenever the
      // worker asks. Without a service worker, or a key for this deployment, it's back to the password page.
      (function() {
        const SALT = 'hOP4w+YGPbK2yRnIieR0Zg==';
        let stored = null;
        try {
          stored = JSON.parse(localStorage.getItem('xmas-pages-key'));
        } catch (e) {
        }
        const sw = navigator.serviceWorker;
        if (!sw || !sw.controller || !stored || (stored.salt !== SALT) || !stored.raw) {
          location.replace('./');
          return;
        }
        sw.addEventListener('message', event => {
          if (event.data && (event.data.type === 'need-key') && event.ports && event.ports[0])
            event.ports[0].postMessage(stored.raw);
        });
        sw.startMessages();
        sw.controller.postMessage({ type: 'raw-key', raw: stored.raw });
      })();
    </script>
    <!-- (pages/analytics-head.html, put into the published game page by pages/deploy.js when a GA4 measurement ID is
         configured) Google Analytics 4. Nothing that needs consent is stored until the player says yes: Consent Mode
         starts denied (cookie-free pings only) unless they said yes before (index.html's xmasAnalytics.consent keeps
         the answer in localStorage). -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KQNCVTXHMW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      (function() {
        let granted = false;
        try {
          granted = (localStorage.getItem('xmas-analytics-consent') === '1');
        } catch (e) {
        }
        gtag('consent', 'default', { analytics_storage: granted ? 'granted' : 'denied', ad_storage: 'denied',
                                     ad_user_data: 'denied', ad_personalization: 'denied' });
      })();
      gtag('js', new Date());
      gtag('config', 'G-KQNCVTXHMW');
    </script>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"/>
    <!-- added to a phone's home screen, the game opens without the browser's bars (iPhone has no full screen for pages) -->
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="Lemmings"/>
    <title>Lemmings SDL2+WebGPU</title>
    <link rel="icon" href="data:,">
    <style>
        /* the page never scrolls or zooms: on a touch screen, drags and pinches are the game's */
        html, body { overscroll-behavior: none; touch-action: none; }
        body { margin: 0; background-color: black; position: fixed; inset: 0; overflow: hidden; }
        .emscripten {
            position: absolute;
            top: 0px;
            left: 0px;
            margin: 0px;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: block;
            cursor: crosshair;
            image-rendering: optimizeSpeed;
            image-rendering: -moz-crisp-edges;
            image-rendering: -o-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            -ms-interpolation-mode: nearest-neighbor;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        #loading {
            position: absolute;
            left: 50%;
            top: 45%;
            transform: translate(-50%, -50%);
            width: 320px;
            font: 16px sans-serif;
            color: #c0c0c0;
            text-align: center;
        }
        #loading-bar { margin-top: 10px; height: 6px; background: #303030; border-radius: 3px; overflow: hidden; }
        #loading-fill { height: 100%; width: 0%; background: #40c040; transition: width 0.1s; }
    </style>
  </head>
  <body>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <div id="loading">
      <div id="loading-text">Loading&hellip;</div>
      <div id="loading-bar"><div id="loading-fill"></div></div>
    </div>
    <script type='text/javascript'>
      // Start-up: the WebGPU device is requested and xmas.js (which fetches the wasm and the data) is loaded at
      // the same time; main() is held back by a run dependency until the device is ready. Timing marks
      // (performance.mark) record each step for tests/startup.spec.js.
      performance.mark('page-start');

      // usage analytics (Yeti::Analytics, plans/roadmap.md Phase 11): events go to Google Analytics 4 only when the
      // published page has gtag (pages/deploy.js puts it in, with the measurement ID, if one is configured); the last
      // few are kept here either way (the tests read them). The player's consent is remembered in localStorage too, so
      // the published page can set it before anything is sent.
      window.xmasAnalytics = {
        log: [],
        keep(entry) {
          this.log.push(entry);
          if (this.log.length > 500)
            this.log.shift();
        },
        event(name, params, closing) {
          this.keep({ name, params });
          if (window.gtag)
            gtag('event', name, closing ? Object.assign({ transport_type: 'beacon' }, params) : params);
        },
        userProperties(properties) {
          this.keep({ name: 'user_properties', params: properties });
          if (window.gtag)
            gtag('set', 'user_properties', properties);
        },
        consent(granted) {
          this.keep({ name: 'consent', params: { granted } });
          try {
            localStorage.setItem('xmas-analytics-consent', granted ? '1' : '0');
          } catch (e) {
          }
          if (window.gtag)
            gtag('consent', 'update', { analytics_storage: granted ? 'granted' : 'denied' });
        }
      };
      var Module;
      (function() {
        // the page's own few messages, shown before the game (and its string files, assets/lang/) is running, in the
        // language the game will use: the player's choice (the game keeps a copy in localStorage, Yeti::SetPageLanguage),
        // else the browser's (the same matching as Strings::Match), else English
        const MESSAGES = {
          'en': { downloading: 'Downloading the game…', graphics: 'Starting the graphics…', progress: 'Loading your progress…',
                  lost: 'The graphics device was lost ({reason}). Reload the page.', needs: 'Lemmings needs WebGPU: {reason}',
                  late: 'it did not start in time. Close this tab and open the game again.', error: 'Error: {reason}',
                  download: 'The game could not be downloaded. Reload the page.' },
          'fr': { downloading: 'Téléchargement du jeu…', graphics: 'Démarrage des graphismes…', progress: 'Chargement de votre progression…',
                  lost: 'Le périphérique graphique a été perdu ({reason}). Rechargez la page.', needs: 'Lemmings a besoin de WebGPU : {reason}',
                  late: 'il n\'a pas démarré à temps. Fermez cet onglet et rouvrez le jeu.', error: 'Erreur : {reason}',
                  download: 'Le jeu n\'a pas pu être téléchargé. Rechargez la page.' },
          'it': { downloading: 'Download del gioco…', graphics: 'Avvio della grafica…', progress: 'Caricamento dei tuoi progressi…',
                  lost: 'Il dispositivo grafico è stato perso ({reason}). Ricarica la pagina.', needs: 'Lemmings richiede WebGPU: {reason}',
                  late: 'non si è avviato in tempo. Chiudi questa scheda e riapri il gioco.', error: 'Errore: {reason}',
                  download: 'Impossibile scaricare il gioco. Ricarica la pagina.' },
          'de': { downloading: 'Das Spiel wird heruntergeladen…', graphics: 'Grafik wird gestartet…', progress: 'Dein Fortschritt wird geladen…',
                  lost: 'Das Grafikgerät ging verloren ({reason}). Lade die Seite neu.', needs: 'Lemmings braucht WebGPU: {reason}',
                  late: 'es ist nicht rechtzeitig gestartet. Schließe diesen Tab und öffne das Spiel erneut.', error: 'Fehler: {reason}',
                  download: 'Das Spiel konnte nicht heruntergeladen werden. Lade die Seite neu.' },
          'es': { downloading: 'Descargando el juego…', graphics: 'Iniciando los gráficos…', progress: 'Cargando tu progreso…',
                  lost: 'Se perdió el dispositivo gráfico ({reason}). Recarga la página.', needs: 'Lemmings necesita WebGPU: {reason}',
                  late: 'no se inició a tiempo. Cierra esta pestaña y vuelve a abrir el juego.', error: 'Error: {reason}',
                  download: 'No se pudo descargar el juego. Recarga la página.' },
          'ja': { downloading: 'ゲームをダウンロード中…', graphics: 'グラフィックスを起動中…', progress: '進行状況を読み込み中…',
                  lost: 'グラフィックスデバイスが失われました（{reason}）。ページを再読み込みしてください。', needs: 'レミングスには WebGPU が必要です: {reason}',
                  late: '時間内に起動しませんでした。このタブを閉じて、もう一度ゲームを開いてください。', error: 'エラー: {reason}',
                  download: 'ゲームをダウンロードできませんでした。ページを再読み込みしてください。' },
          'zh-Hans': { downloading: '正在下载游戏…', graphics: '正在启动图形…', progress: '正在载入你的进度…',
                  lost: '图形设备已丢失（{reason}）。请重新加载页面。', needs: '旅鼠需要 WebGPU：{reason}',
                  late: '未能及时启动。请关闭此标签页，然后重新打开游戏。', error: '错误：{reason}',
                  download: '无法下载游戏。请重新加载页面。' },
          'zh-Hant': { downloading: '正在下載遊戲…', graphics: '正在啟動圖形…', progress: '正在載入你的進度…',
                  lost: '圖形裝置已遺失（{reason}）。請重新載入頁面。', needs: '旅鼠需要 WebGPU：{reason}',
                  late: '未能及時啟動。請關閉此分頁，然後重新開啟遊戲。', error: '錯誤：{reason}',
                  download: '無法下載遊戲。請重新載入頁面。' },
          'ko': { downloading: '게임을 내려받는 중…', graphics: '그래픽을 시작하는 중…', progress: '진행 상황을 불러오는 중…',
                  lost: '그래픽 장치를 잃었습니다({reason}). 페이지를 새로 고치세요.', needs: '레밍스에는 WebGPU가 필요합니다: {reason}',
                  late: '제때 시작되지 않았습니다. 이 탭을 닫고 게임을 다시 여세요.', error: '오류: {reason}',
                  download: '게임을 내려받을 수 없습니다. 페이지를 새로 고치세요.' },
        };
        function pageLanguage() {
          try {
            const saved = localStorage.getItem('xmas-language');
            if (saved && MESSAGES[saved])
              return saved;
          } catch (e) {
          }
          const wanted = (navigator.languages && navigator.languages.length) ? navigator.languages : [ navigator.language || 'en' ];
          for (const raw of wanted) {
            const tag = String(raw).replace(/_/g, '-').toLowerCase();
            const exact = Object.keys(MESSAGES).find(code => code.toLowerCase() === tag);
            if (exact)
              return exact;
            const primary = tag.split('-')[0];
            if (primary === 'zh')
              return /-(hant|tw|hk|mo)\b/.test(tag) ? 'zh-Hant' : 'zh-Hans';
            if (MESSAGES[primary])
              return primary;
          }
          return 'en';
        }
        const language = pageLanguage();
        document.documentElement.lang = language;
        function t(key, reason) {
          return (MESSAGES[language][key] || MESSAGES.en[key]).replace('{reason}', reason || '');
        }

        const loadingText = document.getElementById('loading-text');
        const loadingFill = document.getElementById('loading-fill');
        function showStatus(text, fraction) {
          loadingText.textContent = text;
          if (fraction !== undefined)
            loadingFill.style.width = Math.round(fraction * 100) + '%';
        }
        // (also counted: players who never get as far as the title, and why: the reason in English, whatever is shown)
        function fail(text, step, reason) {
          window.xmasAnalytics.event('load_failed', { step: step || 'unknown', reason: String(reason || text).slice(0, 100) });
          showStatus(text);
          loadingFill.style.background = '#c04040';
          console.error(text);
        }

        // a step that doesn't finish in time fails with a message, instead of leaving "Loading" up for ever
        function inTime(promise, ms, text) {
          return Promise.race([ promise, new Promise((resolve, reject) => setTimeout(() => reject(Object.assign(new Error(text), { late: true })), ms)) ]);
        }

        const devicePromise = inTime((async () => {
          if (!navigator.gpu)
            throw new Error('WebGPU is not supported by this browser');
          const adapter = await navigator.gpu.requestAdapter();
          if (!adapter)
            throw new Error('no WebGPU adapter is available');
          const device = await adapter.requestDevice();
          performance.mark('device-ready');
          device.lost.then(info => {
            if (info.reason !== 'destroyed')
              fail(t('lost', info.message || 'no reason given'), 'graphics_lost', 'The graphics device was lost (' + (info.message || 'no reason given') + ')');
          });
          return device;
        })(), 20000, 'it did not start in time. Close this tab and open the game again.');

        // the device is released when the page goes away (iOS doesn't always, and the next visit then waits for
        // one); a page the browser brings back from its back/forward cache has lost it, so it starts again
        window.addEventListener('pagehide', () => {
          if (Module.preinitializedWebGPUDevice)
            Module.preinitializedWebGPUDevice.destroy();
        });
        window.addEventListener('pageshow', event => {
          if (event.persisted)
            location.reload();
        });

        Module = {
          preRun: [ function() {
            // runs once the wasm and the data have arrived: wait for the device too (usually ready long before)
            Module.addRunDependency('webgpu-device');
            showStatus(t('graphics'));
            devicePromise.then(device => {
              Module.preinitializedWebGPUDevice = device;
              if (!savesDone)
                showStatus(t('progress'));
              Module.removeRunDependency('webgpu-device');
            }, error => fail(t('needs', error.late ? t('late') : error.message), 'graphics', 'Lemmings needs WebGPU: ' + error.message));

            // saves (Yeti::File::ReadSave/WriteSave): /save is kept in IndexedDB; load it before main()
            const FS = Module.FS;
            FS.mkdir('/save');
            FS.mount(FS.filesystems.IDBFS, {}, '/save');
            // (iOS can leave IndexedDB hanging: after a few seconds the game starts without them)
            Module.addRunDependency('saves');
            let savesDone = false;
            const savesLoaded = error => {
              if (savesDone)
                return;
              savesDone = true;
              if (error)
                console.error('saves could not be loaded: ' + error);
              Module.removeRunDependency('saves');
            };
            FS.syncfs(true, savesLoaded);
            setTimeout(() => savesLoaded('IndexedDB did not answer in time'), 8000);
          } ],
          postRun: [],
          print: function(...args) {
            console.log(args.join(' '));
          },
          printErr: function(...args) {
            console.error(args.join(' '));
          },
          canvas: document.getElementById('canvas'),
          setStatus: function(text) {
            console.log('status: ' + text);
            if (!text) {
              // running: the game draws from here
              document.getElementById('loading').style.display = 'none';
              return;
            }
            // e.g. "Downloading data... (123/456)"
            const m = text.match(/^(.*)\((\d+(?:\.\d+)?)\/(\d+)\)\s*$/);
            if (m)
              showStatus(t('downloading'), parseFloat(m[2]) / parseInt(m[3]));
            else
              showStatus(text);
          },
          monitorRunDependencies: function(left) {
          }
        };
        window.onerror = function(message) {
          fail(t('error', message), 'error', 'Error: ' + message);
        };

        showStatus(t('downloading'));
        const js = document.createElement('script');
        js.async = true;
        js.src = 'xmas.js';
        js.onerror = () => fail(t('download'), 'download', MESSAGES.en.download);
        document.body.appendChild(js);
        performance.mark('script-requested');
      })();
    </script>
  </body>
</html>
